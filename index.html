<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sigma System – Vendita e riparazione computer ad Andria</title>
  <meta name="description" content="Sigma System s.r.l. – vendita e riparazione di portatili, computer fissi e componenti ad Andria (BT).">
  <meta property="og:title" content="Sigma System – Soluzioni Informatiche Avanzate">
  <meta property="og:description" content="Portatili, PC fissi e componenti. Vendita, riparazione e assemblaggio su misura ad Andria.">
  <meta property="og:image" content="assets/img/logo.png">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
  <script src="assets/js/content.js?v=4"></script>
  <script>SIGMA.applyColors();</script>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav__inner">
    <a href="#top" class="logo" aria-label="Sigma System">
      <img src="assets/img/logo-mark.png" alt="" width="48" height="48">
      <span class="logo__text">
        <span class="wordmark"></span>
        <span class="tagline"></span>
      </span>
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="#servizi">Servizi</a>
      <a href="#azienda">Azienda</a>
      <a href="#contatti">Contatti</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Apri menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero__inner">
      <div class="hero__copy">
        <h1 data-key="hero_title"></h1>
        <p class="hero__text" data-key="hero_text"></p>
        <a href="#contatti" class="btn">Richiedi assistenza</a>
      </div>
      <svg class="laptop" viewBox="0 0 520 340" role="img" aria-label="Computer portatile">
        <defs>
          <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3ede4"/>
          </linearGradient>
          <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e4dfda"/><stop offset="1" stop-color="#c9c2bb"/>
          </linearGradient>
        </defs>
        <ellipse cx="260" cy="318" rx="230" ry="12" fill="#000" opacity=".08"/>
        <!-- schermo -->
        <rect x="88" y="20" width="344" height="236" rx="14" fill="#2b2527"/>
        <rect x="102" y="34" width="316" height="204" rx="4" fill="url(#screen)"/>
        <circle cx="260" cy="27" r="2.5" fill="#55494c"/>
        <image href="assets/img/logo-mark.png" x="215" y="70" width="90" height="90"/>
        <rect x="190" y="178" width="140" height="8" rx="4" fill="var(--primary)" opacity=".85"/>
        <rect x="215" y="196" width="90" height="6" rx="3" fill="var(--accent)" opacity=".7"/>
        <!-- base -->
        <path d="M60 256h400l40 34a8 8 0 0 1-5 14H25a8 8 0 0 1-5-14z" fill="url(#deck)"/>
        <path d="M20 296h480v4a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8z" fill="#b3aaa2"/>
        <rect x="220" y="296" width="80" height="5" rx="2.5" fill="#9c928a"/>
        <path d="M110 266h300l16 14H94z" fill="#d2ccc6"/>
        <rect x="215" y="284" width="90" height="8" rx="3" fill="#cfc8c1"/>
      </svg>
    </div>
  </section>

  <div class="band" aria-label="Soluzioni Informatiche Avanzate"><span class="tagline"></span></div>

  <!-- SERVIZI -->
  <section class="section section--cream" id="servizi">
    <div class="wrap">
      <h2 class="title" data-key="services_title"></h2>
      <div class="cards">
        <article class="card">
          <div class="card__icon"><svg viewBox="0 0 48 48"><rect x="9" y="10" width="30" height="20" rx="2"/><path d="M4 36h40l-3 3H7z"/></svg></div>
          <h3 data-key="s1_title"></h3>
          <p data-key="s1_text"></p>
        </article>
        <article class="card">
          <div class="card__icon"><svg viewBox="0 0 48 48"><rect x="5" y="8" width="26" height="19" rx="2"/><path d="M14 33h8M18 27v6"/><rect x="35" y="8" width="9" height="30" rx="1.5"/><circle cx="39.5" cy="14" r="1.5"/></svg></div>
          <h3 data-key="s2_title"></h3>
          <p data-key="s2_text"></p>
        </article>
        <article class="card">
          <div class="card__icon"><svg viewBox="0 0 48 48"><rect x="14" y="14" width="20" height="20" rx="2"/><rect x="20" y="20" width="8" height="8"/><path d="M19 8v6M24 8v6M29 8v6M19 34v6M24 34v6M29 34v6M8 19h6M8 24h6M8 29h6M34 19h6M34 24h6M34 29h6"/></svg></div>
          <h3 data-key="s3_title"></h3>
          <p data-key="s3_text"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- AZIENDA -->
  <section class="section section--wine" id="azienda">
    <div class="wrap about">
      <h2 class="title title--gold" data-key="about_title"></h2>
      <p data-key="about_text"></p>
    </div>
  </section>

  <!-- CONTATTI -->
  <section class="section section--cream" id="contatti">
    <div class="wrap">
      <h2 class="title" data-key="contact_title"></h2>
      <div class="contact">
        <div>
          <ul class="info">
            <li>
              <i><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></i>
              <div><small>Indirizzo</small><span data-key="address"></span></div>
            </li>
            <li>
              <i><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></i>
              <div><small>Telefono</small><a href="#" data-tel><span data-key="phone"></span></a></div>
            </li>
            <li>
              <i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></i>
              <div><small>Email</small><a href="#" data-mail><span data-key="email"></span></a></div>
            </li>
            <li>
              <i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i>
              <div><small>Orari</small><span data-key="hours"></span></div>
            </li>
          </ul>
          <iframe class="map" title="Mappa" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="https://maps.google.com/maps?q=Via%20Bologna%2015%2C%20Andria%20BT&z=16&output=embed"></iframe>
        </div>

        <form class="form" id="contactForm">
          <div class="form__row">
            <label>Nome<input name="name" required autocomplete="name"></label>
            <label>Telefono<input name="phone" type="tel" autocomplete="tel"></label>
          </div>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>Richiesta
            <select name="type">
              <option>Riparazione</option>
              <option>Acquisto portatile</option>
              <option>Acquisto PC fisso</option>
              <option>Componenti</option>
              <option>Altro</option>
            </select>
          </label>
          <label>Messaggio<textarea name="message" rows="4" required></textarea></label>
          <button class="btn" type="submit">Invia richiesta</button>
          <p class="form__ok" id="formOk" hidden>Grazie! Ti ricontatteremo al più presto.</p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <a href="#top" class="logo logo--small" aria-label="Sigma System">
      <img src="assets/img/logo-mark.png" alt="" width="36" height="36">
      <span class="logo__text"><span class="wordmark"></span></span>
    </a>
    <p>
      <span data-key="company_name"></span> · <span data-key="address"></span><br>
      P.IVA <span data-key="vat"></span> · © <span id="year"></span>
    </p>
  </div>
</footer>

<script src="assets/js/main.js?v=4"></script>
</body>
</html>
