<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sigma System – Vendita e riparazione computer ad Andria</title>
  <meta name="description" content="Sigma System s.r.l. – vendita e riparazione di portatili, computer fissi e componenti ad Andria (BT).">
  <meta property="og:title" content="Sigma System – Soluzioni Informatiche Avanzate">
  <meta property="og:description" content="Portatili, PC fissi e componenti. Vendita, riparazione e assemblaggio su misura ad Andria.">
  <meta property="og:image" content="assets/img/logo.png">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/content.js"></script>
  <script>SIGMA.applyColors();</script>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav__inner">
    <a href="#top" class="brand">
      <img src="assets/img/logo-mark.png" alt="" width="40" height="40">
      <span>SIGMA SYSTEM</span>
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="#servizi">Servizi</a>
      <a href="#azienda">Azienda</a>
      <a href="#contatti">Contatti</a>
      <a href="#" class="btn btn--gold btn--sm" data-tel>Chiamaci</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Menu"><span></span><span></span></button>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="hero__glow"></div>
    <div class="wrap hero__inner">
      <div class="hero__copy">
        <p class="kicker" data-key="hero_kicker"></p>
        <h1 data-key="hero_title"></h1>
        <p class="hero__text" data-key="hero_text"></p>
        <div class="hero__cta">
          <a href="#contatti" class="btn btn--gold">Richiedi assistenza</a>
          <a href="#" class="btn btn--ghost" data-tel><span data-key="phone"></span></a>
        </div>
      </div>
      <div class="hero__mark" aria-hidden="true">
        <div class="ring"></div>
        <img src="assets/img/logo-mark.png" alt="">
      </div>
    </div>
  </section>

  <!-- SERVIZI -->
  <section class="section" id="servizi">
    <div class="wrap">
      <h2 class="title" data-key="services_title"></h2>
      <div class="cards">
        <article class="card reveal">
          <svg viewBox="0 0 48 48" class="icon"><rect x="9" y="10" width="30" height="20" rx="2"/><path d="M4 36h40l-3 3H7z"/></svg>
          <h3 data-key="s1_title"></h3>
          <p data-key="s1_text"></p>
        </article>
        <article class="card reveal">
          <svg viewBox="0 0 48 48" class="icon"><rect x="5" y="8" width="26" height="19" rx="2"/><path d="M14 33h8M18 27v6"/><rect x="35" y="8" width="9" height="30" rx="1.5"/><circle cx="39.5" cy="14" r="1.5"/></svg>
          <h3 data-key="s2_title"></h3>
          <p data-key="s2_text"></p>
        </article>
        <article class="card reveal">
          <svg viewBox="0 0 48 48" class="icon"><rect x="14" y="14" width="20" height="20" rx="2"/><rect x="20" y="20" width="8" height="8"/><path d="M19 8v6M24 8v6M29 8v6M19 34v6M24 34v6M29 34v6M8 19h6M8 24h6M8 29h6M34 19h6M34 24h6M34 29h6"/></svg>
          <h3 data-key="s3_title"></h3>
          <p data-key="s3_text"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- VANTAGGI -->
  <section class="perks">
    <div class="wrap perks__inner">
      <div class="perk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span data-key="perk1"></span></div>
      <div class="perk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span data-key="perk2"></span></div>
      <div class="perk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span data-key="perk3"></span></div>
      <div class="perk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span data-key="perk4"></span></div>
    </div>
  </section>

  <!-- AZIENDA -->
  <section class="section section--light" id="azienda">
    <div class="wrap about">
      <div class="about__logo reveal">
        <img src="assets/img/logo.png" alt="Sigma System – Soluzioni Informatiche Avanzate">
      </div>
      <div class="about__copy reveal">
        <h2 class="title title--left" data-key="about_title"></h2>
        <p data-key="about_text"></p>
      </div>
    </div>
  </section>

  <!-- CONTATTI -->
  <section class="section" id="contatti">
    <div class="wrap">
      <h2 class="title" data-key="contact_title"></h2>
      <div class="contact">
        <div class="contact__info reveal">
          <ul class="info">
            <li>
              <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
              <span data-key="address"></span>
            </li>
            <li>
              <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
              <a href="#" data-tel><span data-key="phone"></span></a>
            </li>
            <li>
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <a href="#" data-mail><span data-key="email"></span></a>
            </li>
            <li>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span data-key="hours"></span>
            </li>
          </ul>
          <iframe class="map" title="Mappa" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="https://maps.google.com/maps?q=Via%20Bologna%2015%2C%20Andria%20BT&z=16&output=embed"></iframe>
        </div>

        <form class="form reveal" id="contactForm">
          <div class="form__row">
            <label>Nome<input name="name" required autocomplete="name"></label>
            <label>Telefono<input name="phone" type="tel" autocomplete="tel"></label>
          </div>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>Richiesta
            <select name="type">
              <option>Riparazione</option>
              <option>Acquisto portatile</option>
              <option>Acquisto PC fisso</option>
              <option>Componenti</option>
              <option>Altro</option>
            </select>
          </label>
          <label>Messaggio<textarea name="message" rows="4" required></textarea></label>
          <button class="btn btn--gold" type="submit">Invia richiesta</button>
          <p class="form__ok" id="formOk" hidden>Grazie! Ti ricontatteremo al più presto.</p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <a href="#top" class="brand brand--light">
      <img src="assets/img/logo-mark.png" alt="" width="34" height="34">
      <span>SIGMA SYSTEM</span>
    </a>
    <p>
      <span data-key="company_name"></span> · <span data-key="address"></span><br>
      P.IVA <span data-key="vat"></span> · © <span id="year"></span>
    </p>
  </div>
</footer>

<a href="#" class="fab" data-tel aria-label="Chiama">
  <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
</a>

<script src="assets/js/main.js"></script>
</body>
</html>
